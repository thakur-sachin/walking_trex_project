# v9w: v9v (full-range actions on joint limits v2) with a joint-speed penalty.
# Cause (measured 2026-10-24): v9v stopped twice on the wood floor after 8 and 11 s, when the CH341 USB servo adapter
# reset. Hanging, v9v sagged the servo supply to 4.97 V (v9s: 6.01 V) at a mean joint speed of 88 deg/s (v9s 48);
# the tail swung 54 deg (v9s 14). MuJoCo gives the same picture: 81 deg/s mean, tail 136 deg/s (v9s 43, tail 20).
# The reward had no joint-speed term while walking (stand_still acts at command 0 only), and the full-range
# action makes each action unit cover more degrees, so action_rate charges less per degree than in v9s.
# Change: reward joint_speed -2.0 = relu(weighted mean |qd| - 0.7 rad/s (40 deg/s)), tail weight 2.
# Risk: a speed cost can trade forward speed and foot lift for slower joints (short shuffling steps).
# Targets: MuJoCo mean joint speed <= 50 deg/s and tail <= 40 deg/s at 0.10 / mu 0.3; MuJoCo survival >= 35/36,
# >= 90 % of 0.10, >= 60 % of 0.10 at mu 0.15 / 0.20 / 0.27; no joint at a range end > 20 %; hips mean within
# +-5 deg; scorecard >= 8/11; hanging real test: lowest servo supply >= 6.0 V; real wood: no adapter reset,
# >= 36 % with |yaw| <= 25 deg in every run; carpet >= 70 %.
# Run: walk_rl/run_experiment.sh v9w walk_rl/experiments/v9w_joint_speed.yaml v9s v9v
sim:
  ground_friction: 0.1
actuator:
  model: lx16a
command:
  vx_range_mps: [0.03, 0.25]
  slow_prob: 0.35
  slow_range_mps: [0.03, 0.12]
gait:
  frequency_per_mps: 4.0
push:
  start_iter: 500
  end_iter: 1200
  max_lin_vel_mps: 0.35
reward:
  track_vx_sigma_rel: 0.3
  track_vx_sigma_min: 0.015
  gait_contact_mode: both
  joint_limit_range_margin_deg: 3.0
  foot_slip_point: sole
  joint_speed_deadband_rad_s: 0.7
  joint_speed_joint_weights:
    tail_joint: 2.0
  progress_gate_mode: tracking
  progress_gate: [track_heading, track_yaw, roll_band, base_rock, base_acc, gait_contact]
  weights:
    lateral_drift: -10.0
    roll_band: 1.0
    foot_flat: -20.0
    base_height: -1.0
    leg_symmetry: -1.0
    joint_pose: -0.5
    foot_slip: -10.0
    joint_speed: -2.0
observation:
  imu_mount_offset_deg: 2.0
ppo:
  max_action_std: 0.5 # v8e std ran away to ~1 under 0.35 m/s pushes
  symmetry:
    mirror_loss_coef: 0.5
domain_randomization:
  actuator_model: # refit nominal: kp 4.56, Coulomb 0.116, no-load x0.775, stall x1.84
    kp_scale_range: [0.75, 1.3]
    deadband_deg_range: [0.1, 1.0]
    latency_s_range: [0.0, 0.01]
    armature_scale_range: [0.6, 1.6]
    coulomb_friction_nm_range: [0.05, 0.3]
    no_load_speed_scale_range: [0.6, 0.95]
    stall_torque_scale_range: [1.4, 2.2]
    bus_voltage_v_range: [6.6, 8.4]
  # torso inertia is a composite ESTIMATE (robot_config): x0.6-1.6 on top of the mass scaling
  base_inertia_scale_range: [0.6, 1.6]
  # PLA sole on indoor wood, measured static mu 0.27 (tilt test 2026-10-21). PhysX averages robot and
  # ground (sim.ground_friction 0.1) friction, so 0.14-1.6 here = 0.12-0.85 effective (v9o: 0.30-0.85)
  friction_range: [0.14, 1.6]
actions:
  scale_to_range: true
