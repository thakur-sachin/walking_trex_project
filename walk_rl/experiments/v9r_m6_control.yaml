# v9r: the v9o recipe unchanged, retrained on robot model M6 (CoM anchored to the measured balance point).
# Control for v9q (same model, training friction 0.12-0.85 effective): separates the effect of the model
# change from the effect of the lower training friction. Trained in parallel with v9q on 2026-10-21.
# Targets: the same as v9q, so the two compare on one scorecard: MuJoCo >= 60 % of 0.10 at mu 0.15, 0.20,
# 0.27; MuJoCo survival >= 35/36 and no fall at mu 0.15; head/tail mean within +-5 deg, no joint at a
# range end > 20 %. Expected (hypothesis): v9r keeps v9o's weakness at mu 0.15 (34 % on M6).
# Run: walk_rl/run_experiment.sh v9r walk_rl/experiments/v9r_m6_control.yaml v9o v9q
actuator:
  model: lx16a
command:
  vx_range_mps: [0.03, 0.25]
  slow_prob: 0.35
  slow_range_mps: [0.03, 0.12]
gait:
  frequency_per_mps: 4.0
push:
  start_iter: 500
  end_iter: 1200
  max_lin_vel_mps: 0.35
reward:
  track_vx_sigma_rel: 0.3
  track_vx_sigma_min: 0.015
  gait_contact_mode: both
  foot_slip_point: sole
  progress_gate_mode: tracking
  progress_gate: [track_heading, track_yaw, roll_band, base_rock, base_acc, gait_contact]
  weights:
    lateral_drift: -10.0
    roll_band: 1.0
    foot_flat: -20.0
    base_height: -1.0
    leg_symmetry: -1.0
    joint_pose: -0.5
    foot_slip: -10.0
observation:
  imu_mount_offset_deg: 2.0
ppo:
  max_action_std: 0.5 # v8e std ran away to ~1 under 0.35 m/s pushes
  symmetry:
    mirror_loss_coef: 0.5
domain_randomization:
  actuator_model: # refit nominal: kp 4.56, Coulomb 0.116, no-load x0.775, stall x1.84
    kp_scale_range: [0.75, 1.3]
    deadband_deg_range: [0.1, 1.0]
    latency_s_range: [0.0, 0.01]
    armature_scale_range: [0.6, 1.6]
    coulomb_friction_nm_range: [0.05, 0.3]
    no_load_speed_scale_range: [0.6, 0.95]
    stall_torque_scale_range: [1.4, 2.2]
    bus_voltage_v_range: [6.6, 8.4]
  # torso inertia is a composite ESTIMATE (robot_config): x0.6-1.6 on top of the mass scaling
  base_inertia_scale_range: [0.6, 1.6]
  # PLA sole on indoor wood (Sachin): PhysX averages robot and ground (0.5) friction, so
  # 0.1-1.2 here = 0.30-0.85 effective (was 0.45-0.85; PLA on wood is probably ~0.3-0.4)
  friction_range: [0.1, 1.2]
