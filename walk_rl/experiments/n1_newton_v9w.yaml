# n1: the v9w recipe trained on Isaac Lab 3 + Newton (MJWarp), walk_lab3/env.py. Pipeline proof, no task change.
# Why: Newton trains 3.5x faster here (0.9 s/it against 3.3 s/it, 4096 envs) and runs the same MuJoCo physics as the
# sim2sim check; the ankle linkage is an engine constraint (tendon limit) instead of a teleport. Before any new
# training work moves to Newton, a Newton-trained policy must be as good as the PhysX-trained one on the same checks.
# Change against v9w: TRAIN_BACKEND=lab3 only (robot geom friction set to the PhysX mean, see walk_lab3/env.py).
# Targets (against v9w on the same scorecard): MuJoCo survival 36/36; MuJoCo speed at 0.10 within 15 points of v9w
# (71 %); mean joint speed <= 50 deg/s; Isaac (PhysX) evaluation survival within 0.05 of v9w; scorecard >= 7/11.
# Run: TRAIN_BACKEND=lab3 walk_rl/run_experiment.sh n1 walk_rl/experiments/n1_newton_v9w.yaml v9s v9w
sim:
  ground_friction: 0.1
actuator:
  model: lx16a
command:
  vx_range_mps: [0.03, 0.25]
  slow_prob: 0.35
  slow_range_mps: [0.03, 0.12]
gait:
  frequency_per_mps: 4.0
push:
  start_iter: 500
  end_iter: 1200
  max_lin_vel_mps: 0.35
reward:
  track_vx_sigma_rel: 0.3
  track_vx_sigma_min: 0.015
  gait_contact_mode: both
  joint_limit_range_margin_deg: 3.0
  foot_slip_point: sole
  joint_speed_deadband_rad_s: 0.7
  joint_speed_joint_weights:
    tail_joint: 2.0
  progress_gate_mode: tracking
  progress_gate: [track_heading, track_yaw, roll_band, base_rock, base_acc, gait_contact]
  weights:
    lateral_drift: -10.0
    roll_band: 1.0
    foot_flat: -20.0
    base_height: -1.0
    leg_symmetry: -1.0
    joint_pose: -0.5
    foot_slip: -10.0
    joint_speed: -2.0
observation:
  imu_mount_offset_deg: 2.0
ppo:
  max_action_std: 0.5 # v8e std ran away to ~1 under 0.35 m/s pushes
  symmetry:
    mirror_loss_coef: 0.5
domain_randomization:
  actuator_model: # refit nominal: kp 4.56, Coulomb 0.116, no-load x0.775, stall x1.84
    kp_scale_range: [0.75, 1.3]
    deadband_deg_range: [0.1, 1.0]
    latency_s_range: [0.0, 0.01]
    armature_scale_range: [0.6, 1.6]
    coulomb_friction_nm_range: [0.05, 0.3]
    no_load_speed_scale_range: [0.6, 0.95]
    stall_torque_scale_range: [1.4, 2.2]
    bus_voltage_v_range: [6.6, 8.4]
  # torso inertia is a composite ESTIMATE (robot_config): x0.6-1.6 on top of the mass scaling
  base_inertia_scale_range: [0.6, 1.6]
  # PLA sole on indoor wood, measured static mu 0.27 (tilt test 2026-10-21). PhysX averages robot and
  # ground (sim.ground_friction 0.1) friction, so 0.14-1.6 here = 0.12-0.85 effective (v9o: 0.30-0.85)
  friction_range: [0.14, 1.6]
actions:
  scale_to_range: true
