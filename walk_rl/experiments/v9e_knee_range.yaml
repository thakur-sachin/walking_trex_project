# v9e: v9d's recipe on the updated robot model, with the forward-knee range open (redesign study
# T1 on the current robot). robot_config 2026-10-19: base_link 0.9 kg, head 0.105 / tail 0.058 kg
# (estimates; total 1.50 kg, was 1.78), hips -30..+7 deg, tibias -45..+90 deg, coupled ankle limit
# -55 <= femur - tibia <= +37 deg (as-built CAD contacts). Only change in the task: the tibia
# action scale is 90 deg (was robot_config's 45), so the policy can reach the forward-knee range.
# The redesign audit found 26 mm of mid-swing foot lift possible this way (1 mm at +/-45 deg).
# Run: python walk_rl/train.py --name v9e --iterations 1500 --task walk_rl/experiments/v9e_knee_range.yaml
actuator:
  model: lx16a
actions:
  joint_scale_deg:
    left_tibia_joint: 90.0
    right_tibia_joint: 90.0
command:
  vx_range_mps: [0.03, 0.25]
  slow_prob: 0.35
  slow_range_mps: [0.03, 0.12]
gait:
  frequency_per_mps: 4.0
push:
  start_iter: 500
  end_iter: 1200
  max_lin_vel_mps: 0.35
reward:
  track_vx_sigma_rel: 0.3
  track_vx_sigma_min: 0.015
  gait_contact_mode: both
  weights:
    lateral_drift: -10.0
    roll_band: 1.0
    foot_flat: -20.0
ppo:
  max_action_std: 0.5
domain_randomization:
  base_inertia_scale_range: [0.6, 1.6]
  friction_range: [0.1, 1.2]
