# v9c: v9a + A4, the LX-16A servo model fitted to the real servos (walk_rl/actuator.py,
# robot_config actuator_model, DR in walk_task.yaml domain_randomization.actuator_model).
# Everything else is v9a, so v9c vs v9a isolates the servo model. The comparison that
# matters is under lx16a physics (evaluate.py --actuator lx16a), where v9a/v8e lose most.
# Run: python walk_rl/train.py --name v9c --iterations 1500 --task walk_rl/experiments/v9c_actuator.yaml
actuator:
  model: lx16a
gait:
  frequency_per_mps: 4.0
push:
  start_iter: 500
  end_iter: 1200
  max_lin_vel_mps: 0.35
reward:
  weights:
    lateral_drift: -10.0
    roll_band: 1.0
    foot_flat: -20.0
ppo:
  max_action_std: 0.5 # v8e std ran away to ~1 under 0.35 m/s pushes
domain_randomization:
  # torso inertia is a composite ESTIMATE (robot_config): x0.6-1.6 on top of the mass scaling
  base_inertia_scale_range: [0.6, 1.6]
  # PLA sole on indoor wood (Sachin): PhysX averages robot and ground (0.5) friction, so
  # 0.1-1.2 here = 0.30-0.85 effective (was 0.45-0.85; PLA on wood is probably ~0.3-0.4)
  friction_range: [0.1, 1.2]
