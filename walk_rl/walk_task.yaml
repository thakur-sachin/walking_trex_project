# Trex forward-walking RL task: everything tunable about the *task* (not the
# robot) lives here. Robot physical parameters (joint limits, servo torque,
# speed, resolution, mass) are read from assets/robots/trex/robot_config.yaml
# and must not be duplicated in this file.
#
# Task interface is grounded in what the real robot can sense and do:
#   actions     8 servo position targets (robot_config `actuated_joints`);
#               ankles are derived by the linkage (ankle = femur - tibia).
#   actor obs   BNO055 IMU (gravity direction, gyro) + 8 servo position
#               readings (quantized to the LX-16A's resolution) + own previous
#               action + velocity command + gait clock. NO base linear
#               velocity, NO joint velocity (finite-differenced from position
#               readings, as the Pi would), NO foot contact (no sensors).
#   critic obs  actor obs (noise-free) + privileged sim state (base velocity,
#               foot contacts/heights, servo torques). Used in training only.

sim:
  physics_hz: 200
  # Control rate. LX-16A bus budget at 115200 baud (10 bit/byte frames): one
  # position write per servo is 10 B (8 servos = 80 B = ~6.9 ms) and one
  # position read is 6 B request + 8 B reply (8 servos = 112 B = ~9.7 ms),
  # ~16.6 ms of pure wire time per cycle, i.e. ~60 Hz theoretical ceiling
  # before Pi-side Python/USB-serial latency. 25 Hz leaves ~2x margin; a
  # policy trained at 25 Hz can always be run on hardware that manages more,
  # the reverse is not true. Must divide physics_hz.
  control_hz: 25
  env_spacing_m: 1.0
  episode_length_s: 20.0
  spawn_height_m: 0.02 # same small clearance as scripts/test_load_robot.py

command:
  # Forward velocity command (body-x, m/s). Hips are abduction joints (no hip
  # yaw) and the robot has no lateral/turning capability worth commanding
  # yet, so v1 is straight-line walking: vy and yaw-rate are penalized, not
  # commanded.
  vx_range_mps: [0.05, 0.25] # walking commands; 0 comes from standing_prob. v8: 0.25 so 0.20 is not the edge
  standing_prob: 0.2 # fraction of commands that are exactly 0 (stand still)
  resample_time_s: 5.0

gait:
  # Phase clock: deployable (pure time), strongly regularizes bipedal gaits.
  use_phase_clock: true
  frequency_hz: 1.8
  # Speed-scaled clock (v8d experiment; 0 = fixed frequency, the default):
  # f = frequency_hz + frequency_per_mps * (cmd_vx - frequency_ref_mps), clamped to frequency_range_hz.
  frequency_per_mps: 0.0
  frequency_ref_mps: 0.10
  frequency_range_hz: [1.6, 2.4]
  stance_ratio: 0.6 # fraction of the cycle each foot is on the ground
  walking_cmd_threshold_mps: 0.03

actions:
  # target = default_pos + a * (scale_frac_of_limit * joint_limit), a in [-1,1]
  scale_frac_of_limit: 1.0
  quantize_to_servo_resolution: true # commands are 0.24 deg steps on real servo
  # Servo-input low-pass: cmd = alpha*cmd_prev + (1-alpha)*action. 0 disables. At 25 Hz,
  # 0.5 -> ~4 Hz cutoff, ~1 control step of lag. Must be mirrored in the deployed loop.
  smoothing_alpha: 0.5
  # Serial-bus/driver latency, in control steps (40 ms each), sampled per episode.
  # v8: up to 2 (Open Duck uses 0-2 at 50 Hz); real LX-16A latency not measured yet.
  delay_steps_range: [0, 2]

observation:
  noise: # sensor noise std (rough BNO055 / LX-16A estimates, flagged as such)
    gravity: 0.02 # ~1 deg orientation error
    gyro_rad_s: 0.05
    joint_pos_rad: 0.003 # on top of quantization
  # v8 (estimates, flagged): per-episode servo calibration offset on the READINGS (BD-X uses
  # +/-0.02 rad encoder offsets); IMU latency in control steps.
  encoder_offset_rad: 0.02
  imu_delay_steps_range: [0, 1]
  # Stack of the last K actor frames (humanoid-gym 15, Open Duck 3 actions). Lets the policy
  # infer velocity and foot contact, which no sensor measures. Pi keeps the same ring buffer.
  history_len: 3
  heading:
    # Heading error to a reference yaw latched at the start of walking (BNO055 fused yaw;
    # Digit/BD-X observe heading the same way). Sachin approved this sensor-contract change.
    enabled: true
    ref_init_range_rad: 0.15 # start this far off the reference: correcting heading is part of the task
    drift_deg_per_min: 3.0 # BNO055 IMU-mode yaw drift, estimate (per-episode rate, +/-)
    noise_rad: 0.01
  scales:
    gyro: 0.25
    joint_vel: 0.05
    lin_vel: 2.0

termination:
  max_tilt_deg: 55.0
  min_head_height_m: 0.12 # head link z (standing ~0.216)
  # Only the feet may touch the ground. v4 learned to drag its tail as a third point of
  # balance; head/tail are there to *help balance*, not to be props. Any contact force above
  # the threshold on one of these links terminates the episode.
  ground_contact_links: [head, tail, base_link, left_femur, right_femur, left_tibia, right_tibia, left_ankle, right_ankle]
  ground_contact_force_n: 0.2

foot:
  # Privileged contact only (the real robot has no foot sensors; the actor never sees it).
  # From PhysX contact reports: a foot-link height threshold was wrong because the 4-bar
  # linkage keeps the feet parallel to the base, so body lean tilts them.
  contact_force_threshold_n: 1.0 # a foot carries ~6-7 N standing
  swing_clearance_target_m: 0.02 # height of the swing foot above the stance foot

reward:
  weights:
    track_vx: 3.0
    alive: 0.5
    upright: -4.0 # projected gravity xy squared
    lateral_vel: -2.0
    yaw_rate: -1.0
    track_yaw: 1.5 # exp(-wz^2/sigma^2); v1 circled ~100 deg/20 s without this
    action_accel: -0.05 # 2nd difference; NOTE -0.5 charged ~-3/step for exploration noise alone (v2 failed)
    ang_vel_xy: -0.05
    gait_contact: 2.0 # contact pattern matches phase clock
    swing_clearance: 2.0
    air_time: 6.0 # per touchdown: (swing duration - min) clipped to [0, max-min] seconds
    foot_slip: -1.0
    action_rate: -0.05
    torque: -0.02 # normalized by servo stall torque
    joint_limit: -2.0
    hip_deviation: -0.5
    body_contact: -5.0 # extra on top of terminated: tail/head/body on the ground
    terminated: -10.0
    # v8 terms (see docs/WALK_TASK.md "Reward research"); 0 or absent disables a term
    track_heading: 1.5 # Digit yaw-orientation tracking
    track_vx_lin: -2.0 # humanoid-gym track_vel_hard: |vx - cmd|, does not saturate
    base_acc: 0.5 # humanoid-gym/Digit: exp(-|dv|/sigma), smooth base
    base_rock: 0.5 # humanoid-gym vel_mismatch_exp (roll/pitch rate part)
    stand_still: -0.3 # Open Duck: mean |joint vel| when the command is 0
    torque_sat: -2.0 # sum relu(|tau|/stall - 0.8): LX-16A headroom
    feet_distance: -1.0 # humanoid-gym: lateral foot spacing within a band
  track_vx_sigma: 0.06 # v8: 0.08 -> 0.06
  yaw_sigma_rad_s: 0.10
  air_time_min_s: 0.10
  air_time_max_s: 0.30
  joint_limit_margin: 0.9 # penalize beyond this fraction of the limit
  heading_sigma_rad: 0.15
  base_acc_sigma_mps: 0.05 # per control step (40 ms)
  base_rock_sigma_rad_s: 1.0 # v7 rocked at |w_xy| ~1.4 rad/s
  torque_sat_frac: 0.8
  feet_lateral_band_frac: [0.7, 1.5] # x the spawn-pose lateral foot spacing

harness:
  # Training-only curriculum. v6 (tail forbidden) stood still for 200+ iterations: foot air
  # time stayed 0.000 because lifting a foot unaided is an exploration barrier. The harness
  # holds the body up and level so stepping is safe to discover; its strength is annealed
  # to 0, so the final policy balances unassisted (evaluate with the harness OFF).
  enabled: true
  weight_fraction: 0.7 # upward force on the base, fraction of total body weight (at alpha=1)
  torque_kp: 3.0 # N*m per rad of roll/pitch error (righting torque)
  torque_kd: 0.15 # N*m per rad/s
  start_iter: 150 # alpha = 1 until here
  end_iter: 450 # then linear to 0

push:
  # Training-only disturbances: instantaneous base-velocity changes (BD-X, Open Duck,
  # humanoid-gym). Ramped in after the harness is gone: scale 0 until start_iter, 1 at end_iter.
  enabled: true
  start_iter: 500
  end_iter: 800
  interval_s: [4.0, 8.0]
  max_lin_vel_mps: 0.25 # xy, at scale 1 (robot walks at <=0.25 m/s)
  max_ang_vel_rad_s: 0.5

domain_randomization:
  enabled: true
  friction_range: [0.4, 1.2]
  # v8 tried [0.7, 1.5]: under the harness, envs above x1.1 fell 4-7x more often (servos cannot
  # hold a heavier base up; v7 notes tibia saturation at 1.0 kg). Kept at v7 range until the real
  # mass is known -- a heavy real base_link is a hardware problem, not a policy one.
  base_mass_scale_range: [0.8, 1.3]
  limb_mass_scale_range: [0.85, 1.15] # head, tail
  base_com_offset_m: 0.015 # battery/Pi placement not measured
  pd_gain_scale_range: [0.85, 1.15]
  torque_cap_scale_range: [0.85, 1.0] # servos weaker than datasheet, never stronger
  reset_joint_noise_rad: 0.05
  reset_tilt_noise_rad: 0.03

ppo:
  num_envs: 4096
  rollout_steps: 24
  epochs: 5
  minibatches: 4
  gamma: 0.99
  lam: 0.95
  clip: 0.2
  value_coef: 1.0
  entropy_coef: 0.005
  lr: 5.0e-4 # v3 at 1e-3 collapsed at ~it 750 (single-update KL 0.24); minibatch KL guard added
  lr_decay_to: 1.0e-4 # linear decay across each train.py call
  desired_kl: 0.02 # KL guard: stop updating at 2x this per minibatch, 1.5x per epoch
  max_grad_norm: 1.0
  init_log_std: -1.0
  actor_hidden: [128, 128, 64] # small: must fit a Pi 4 CPU control loop
  critic_hidden: [256, 128, 64]
